services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: t_minus_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=T-Minus Mission Control API
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - CACHE_TTL_SECONDS=300
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mission_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: t_minus_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mission_net

networks:
  mission_net:
    driver: bridge
